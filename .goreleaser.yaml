version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: sshgate
    main: .
    binary: sshgate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: default
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: 'checksums.txt'

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^ci:'
      - Merge pull request
      - Merge branch

release:
  github:
    owner: jeprecated
    name: sshgate
  draft: true
  prerelease: auto

brews:
  - name: sshgate
    repository:
      owner: jeprecated
      name: tap
    directory: Formula
    homepage: https://github.com/jeprecated/sshgate
    description: Human-gated SSH proxy for agent sessions
    license: MIT
    install: |
      bin.install "sshgate"
    test: |
      system "#{bin}/sshgate", "version"

